name: Test upload binary release asset without explicit content type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a binary test asset
        run: |
          # Create a small binary-like file (a tar.gz)
          echo "binary content" > /tmp/myapp
          tar -czf /tmp/myapp.tar.gz -C /tmp myapp

      - id: upload
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          upload_url: "https://uploads.github.com/repos/actionchain-harness/test/releases/1/assets{?name,label}"
          asset_path: /tmp/myapp.tar.gz
          asset_name: myapp.tar.gz

      - name: Assert action ran for binary asset (fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          DOWNLOAD_URL: ${{ steps.upload.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: binary upload succeeded, download URL: $DOWNLOAD_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
