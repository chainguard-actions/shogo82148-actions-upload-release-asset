name: Test multiple files with asset_name is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create assets
        run: |
          mkdir -p "$RUNNER_TEMP/multi"
          echo "a" > "$RUNNER_TEMP/multi/a.txt"
          echo "b" > "$RUNNER_TEMP/multi/b.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_url: https://uploads.github.com/repos/example-owner/example-repo/releases/1/assets{?name,label}
          asset_path: ${{ runner.temp }}/multi/*.txt
          asset_name: combined.txt
      - name: Assert action failed validation
        env:
          RESULT: ${{ steps.action.outputs.browser_download_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected validation failure for multiple files with asset_name"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected empty browser_download_url"
            exit 1
          fi
          echo "PASS"
