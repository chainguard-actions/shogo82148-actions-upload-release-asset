name: Test upload release asset with binary file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a binary test asset
        run: |
          echo "binary content" | gzip > /tmp/test-binary.tar.gz

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          upload_url: "https://uploads.github.com/repos/actionchain-harness/nonexistent/releases/1/assets{?name,label}"
          asset_path: /tmp/test-binary.tar.gz
          asset_name: test-binary.tar.gz
          asset_content_type: application/gzip

      - name: Assert action ran with binary asset (failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but browser_download_url is empty"
              exit 1
            fi
            echo "PASS: got download URL '$DOWNLOAD_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
