name: Test basic upload with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy asset file
        run: |
          echo "dummy asset content" > /tmp/test-asset.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          upload_url: "https://uploads.github.com/repos/octocat/Hello-World/releases/1/assets{?name,label}"
          asset_path: /tmp/test-asset.txt
          asset_name: test-asset.txt
          asset_content_type: text/plain

      - name: Assert action ran (may fail due to invalid upload_url in test env)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail since upload_url is not a real release URL
          # but we verify the inputs were accepted and the action attempted to run
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all inputs covered"
