name: Test basic upload (sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create asset
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          echo "hello world" > "$RUNNER_TEMP/assets/hello.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_url: https://uploads.github.com/repos/${{ github.repository }}/releases/1/assets{?name,label}
          asset_path: ${{ runner.temp }}/assets/hello.txt
          asset_content_type: text/plain
      - name: Assert action ran (output set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.browser_download_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            case "$RESULT" in
              http*hello.txt) echo "PASS: got '$RESULT'" ;;
              *) echo "FAIL: unexpected browser_download_url '$RESULT'"; exit 1 ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
