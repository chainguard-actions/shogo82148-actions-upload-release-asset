name: Test basic upload (fake URL, expect API error)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test asset file
        run: |
          echo "hello release asset" > "$GITHUB_WORKSPACE/test-asset.txt"

      - name: Upload release asset (expect failure due to fake URL)
        id: upload
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          upload_url: https://uploads.github.com/repos/test-owner/test-repo/releases/999999999/assets{?name,label}
          asset_path: ${{ github.workspace }}/test-asset.txt
          asset_name: test-asset.txt
          asset_content_type: text/plain

      - name: Assert action ran (outcome should be failure due to fake API)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid credentials/URL"
