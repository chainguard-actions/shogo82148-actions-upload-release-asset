name: Test missing asset path (error handling)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          upload_url: "https://uploads.github.com/repos/actionchain-harness/fake__repo/releases/1/assets{?name,label}"
          asset_path: /tmp/this-file-does-not-exist-at-all.txt
          asset_name: nonexistent.txt
          asset_content_type: text/plain

      - name: Assert action failed due to missing asset
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when asset path does not exist"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for a missing asset path"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
