name: Test upload release asset with missing asset path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          upload_url: "https://uploads.github.com/repos/actionchain-harness/test__repo/releases/1/assets{?name,label}"
          asset_path: /tmp/nonexistent-file-that-does-not-exist.txt
          asset_name: nonexistent.txt
          asset_content_type: text/plain

      - name: Assert action handled missing asset gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.browser_download_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "browser_download_url: $DOWNLOAD_URL"
          # When no files match the glob, the action emits a warning and returns
          # success with an empty browser_download_url (it does NOT fail).
          # It may also fail if the sentinel repo API call is reached first.
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$DOWNLOAD_URL" ]; then
              echo "FAIL: expected empty browser_download_url for missing asset, got: $DOWNLOAD_URL"
              exit 1
            fi
            echo "PASS: action succeeded with empty URL (no files matched glob)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo API call failed before glob check)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
