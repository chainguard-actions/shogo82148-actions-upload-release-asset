name: Test no files found for asset_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_url: https://uploads.github.com/repos/example-owner/example-repo/releases/1/assets{?name,label}
          asset_path: ${{ runner.temp }}/does-not-exist/*.zip
      - name: Assert action failed with empty output
        env:
          RESULT: ${{ steps.action.outputs.browser_download_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no files match asset_path"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected empty browser_download_url"
            exit 1
          fi
          echo "PASS"
