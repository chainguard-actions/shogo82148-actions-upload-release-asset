name: Test invalid upload_url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create asset
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          echo "data" > "$RUNNER_TEMP/assets/file.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_url: https://example.invalid/not-a-release-url
          asset_path: ${{ runner.temp }}/assets/file.txt
      - name: Assert action failed
        env:
          RESULT: ${{ steps.action.outputs.browser_download_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unparseable upload_url"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected empty browser_download_url"
            exit 1
          fi
          echo "PASS"
