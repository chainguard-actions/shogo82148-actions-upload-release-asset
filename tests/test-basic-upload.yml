name: Test basic upload with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy asset file
        run: |
          echo "dummy asset content" > /tmp/test-asset.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          upload_url: https://uploads.github.com/repos/test-owner/test-repo/releases/1/assets{?name,label}
          asset_path: /tmp/test-asset.txt
          asset_name: test-asset.txt
          asset_content_type: text/plain
          overwrite: false

      - name: Assert action ran (expected to fail with API error, not input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because the upload_url and token are fake.
          # What matters is that all inputs were accepted and the action attempted to run.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with all inputs provided"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
