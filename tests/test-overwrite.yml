name: Test upload with overwrite enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy asset file
        run: |
          echo "dummy asset content for overwrite test" > /tmp/test-overwrite-asset.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          upload_url: https://uploads.github.com/repos/test-owner/test-repo/releases/1/assets{?name,label}
          asset_path: /tmp/test-overwrite-asset.txt
          asset_name: test-overwrite-asset.txt
          asset_content_type: text/plain
          overwrite: true

      - name: Assert action ran with overwrite input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because we used a fake token and URL.
          # We just verify it ran (not skipped) and covered all required inputs including overwrite.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with overwrite input covered"
