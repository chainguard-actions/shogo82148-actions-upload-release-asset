name: Test overwrite flag (expect API error with fake URL)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test asset file
        run: |
          echo "overwrite test content" > "$GITHUB_WORKSPACE/overwrite-asset.txt"

      - name: Upload release asset with overwrite enabled
        id: upload
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          upload_url: https://uploads.github.com/repos/test-owner/test-repo/releases/999999999/assets{?name,label}
          asset_path: ${{ github.workspace }}/overwrite-asset.txt
          asset_name: overwrite-asset.txt
          asset_content_type: text/plain
          overwrite: true

      - name: Assert action ran with overwrite flag (expect failure due to fake API)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials/URL even with overwrite=true, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid credentials/URL with overwrite=true"
